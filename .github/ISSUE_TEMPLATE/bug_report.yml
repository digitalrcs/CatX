name: Bug report
description: Report a reproducible CatX problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For a recovery vulnerability, use private vulnerability reporting instead of a public issue."
  - type: input
    id: version
    attributes:
      label: CatX version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard layout and recovery shortcut
      placeholder: "US English, Ctrl + Alt + K"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include passwords, private typed content, or secrets.
      placeholder: "1. Open CatX…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
