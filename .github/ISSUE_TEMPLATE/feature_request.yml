name: Feature request
description: Suggest a safe improvement to CatX
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this improvement help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Keyboard recovery and privacy impact
      description: Explain any effect on recovery shortcuts, stored data, or permissions.
    validations:
      required: true
