name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/CatX/CatX.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/CatX.exe -DestinationPath CatX-win-x64.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: CatX-win-x64.zip
          generate_release_notes: true
