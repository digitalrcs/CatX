name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: .\installer\Build-Installer.ps1
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/CatX/CatX.exe,output/pdf/CatX-User-Guide-v1.0.2.pdf,LICENSE -DestinationPath CatX-win-x64.zip
      - name: Create checksums
        shell: pwsh
        run: |
          Get-FileHash dist/CatX-Setup-*.exe,dist/CatX-Windows11-*.zip,CatX-win-x64.zip,output/pdf/CatX-User-Guide-v1.0.2.pdf -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content SHA256SUMS.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CatX-win-x64.zip
            dist/CatX-Setup-*.exe
            dist/CatX-Windows11-*.zip
            output/pdf/CatX-User-Guide-v1.0.2.pdf
            SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES_1.0.2.md
