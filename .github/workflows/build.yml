name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore CatX.sln
      - name: Verify realistic animation assets
        shell: pwsh
        run: .\tools\Test-RealisticAssets.ps1
      - name: Build
        run: dotnet build CatX.sln --configuration Release --no-restore
      - name: Test recovery-key state tracking
        run: dotnet test tests/CatX.Tests/CatX.Tests.csproj --configuration Release --no-build
      - name: Publish self-contained executable
        run: dotnet publish src/CatX/CatX.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/CatX
      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: CatX-win-x64
          path: artifacts/CatX/CatX.exe
          if-no-files-found: error
